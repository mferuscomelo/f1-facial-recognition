; SG Wireless F1 Starter Kit (ESP32-S3, 16 MB flash, 8 MB PSRAM), ESP-IDF framework
[env:f1]
platform = espressif32 @ 6.13.0
board = esp32-s3-devkitc-1
framework = espidf
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 6291456  ; the one app slot in partitions.csv
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.partitions = partitions.csv
; Flashing erases the whole chip first: registered people and settings are gone, a fresh start.
extra_scripts = post:tools/erase_on_upload.py
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.embed_txtfiles = components/preview/index.html  ; the live preview page
