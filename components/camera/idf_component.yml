## Stage 3 camera dependencies (versions checked on components.espressif.com, 2026-11-10)
dependencies:
  idf: ">=5.5"
  # USB Video Class host driver (successor of the deprecated usb_stream). Pulls espressif/usb (USB Host lib).
  espressif/usb_host_uvc: "^2.6.0"
  # Software JPEG decoder (TJpgDec wrapper / ROM tjpgd). ESP32-S3 has no HW JPEG decoder.
  espressif/esp_jpeg: "^1.3.2"
