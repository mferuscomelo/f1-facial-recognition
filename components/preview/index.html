<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F1 FaceCam</title>
<style>
  :root { color-scheme: dark; --accent: #e040fb; --muted: #9aa0a6; }
  body { margin: 0; padding: 16px; background: #111418; color: #e8eaed;
         font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p { margin: 0 0 12px; color: var(--muted); }
  canvas { width: 100%; height: auto; border-radius: 10px; background: #000; display: block; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
  .stat { background: #1c2026; border-radius: 8px; padding: 8px 10px; }
  .stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 12px; color: var(--muted); }
  .face b { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>F1 FaceCam: live view</h1>
  <p>Webcam on the SG Wireless F1, face detection by an Edge Impulse model running on the board.
     The dashed square is what the model sees.</p>
  <canvas id="view" width="320" height="240"></canvas>
  <div class="stats">
    <div class="stat" id="facesBox"><b id="faces">–</b><span>faces</span></div>
    <div class="stat"><b id="score">–</b><span>best score</span></div>
    <div class="stat"><b id="model">–</b><span>model time</span></div>
    <div class="stat"><b id="fps">–</b><span>preview fps</span></div>
  </div>
</main>
<script>
const canvas = document.getElementById('view');
const ctx = canvas.getContext('2d');
const $ = id => document.getElementById(id);
let frames = 0, lastFpsTime = performance.now();

// Boxes come in model pixels (e.g. 96x96). The model sees the centre square of the camera
// image, so map them back onto that square.
function draw(image, det) {
  if (canvas.width !== image.width) { canvas.width = image.width; canvas.height = image.height; }
  ctx.drawImage(image, 0, 0);
  const side = Math.min(image.width, image.height);
  const ox = (image.width - side) / 2, oy = (image.height - side) / 2, scale = side / det.size;

  ctx.setLineDash([6, 6]); ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.strokeRect(ox, oy, side, side);
  ctx.setLineDash([]);

  let best = 0;
  for (const [x, y, w, h, score] of det.faces) {
    best = Math.max(best, score);
    // FOMO finds the centre of each face, so draw a fixed-size square around it.
    const cx = ox + (x + w / 2) * scale, cy = oy + (y + h / 2) * scale;
    const s = Math.max(w, h, det.size / 3) * scale;
    ctx.lineWidth = 3; ctx.strokeStyle = '#e040fb';
    ctx.strokeRect(cx - s / 2, cy - s / 2, s, s);
    const label = `face ${Math.round(score * 100)}%`;
    ctx.font = 'bold 13px system-ui, sans-serif';
    ctx.fillStyle = '#e040fb';
    ctx.fillRect(cx - s / 2 - 1.5, cy - s / 2 - 20, ctx.measureText(label).width + 10, 20);
    ctx.fillStyle = '#fff';
    ctx.fillText(label, cx - s / 2 + 4, cy - s / 2 - 5);
  }
  $('faces').textContent = det.faces.length;
  $('facesBox').classList.toggle('face', det.faces.length > 0);
  $('score').textContent = det.faces.length ? best.toFixed(2) : '–';
  $('model').textContent = det.ms ? det.ms + ' ms' : '–';
}

async function loop() {
  try {
    const res = await fetch('/frame.jpg', { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    const det = JSON.parse(res.headers.get('X-Detections') || '{"size":96,"faces":[]}');
    const image = await createImageBitmap(await res.blob());
    draw(image, det);
    image.close();
    frames++;
  } catch (e) {
    await new Promise(r => setTimeout(r, 500));  // camera not ready or connection hiccup: retry
  }
  const now = performance.now();
  if (now - lastFpsTime > 1000) {
    $('fps').textContent = (frames * 1000 / (now - lastFpsTime)).toFixed(1);
    frames = 0; lastFpsTime = now;
  }
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
